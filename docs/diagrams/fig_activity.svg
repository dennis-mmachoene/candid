<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1000" width="1020" height="1000"><title>Activity — upload and de-identify</title><defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#475569"/></marker>
  <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#2563eb"/></marker>
  <marker id="arrowv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#7c3aed"/></marker>
  <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#b91c1c"/></marker>
  <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9" fill="none" stroke="#475569" stroke-width="1.4"/></marker>
  <marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#475569" stroke-width="1.3"/></marker>
  <marker id="hollowv" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/></marker>
  <marker id="diamond" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
    <path d="M0,5 L6.5,1 L13,5 L6.5,9 z" fill="#ffffff" stroke="#475569" stroke-width="1.2"/></marker>
  <marker id="filldiamond" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
    <path d="M0,5 L6.5,1 L13,5 L6.5,9 z" fill="#475569"/></marker>
</defs><rect width="1020" height="1000" fill="#ffffff"/><text x="510" y="30" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Activity diagram — uploading and de-identifying a CV</text><text x="510" y="50" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">Guarantee 1 in sequence. The order of the three redaction steps is load-bearing.</text><circle cx="400" cy="88" r="10" fill="#0f172a" stroke="#0f172a" stroke-width="1.2"/><path d="M400 98 L 400 120" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="250" y="120" width="300" height="56" rx="14" fill="#ffffff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/><text x="400.0" y="145.95" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Receive uploaded file</text><text x="400.0" y="163.89999999999998" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">FormData, server-side only</text><path d="M400 176 L 400 208" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><polygon points="400,208.0 455.0,234 400,260.0 345.0,234" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="400" y="231" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">size ≤ 5 MB?</text><path d="M455 234 L 760 234" fill="none" stroke="#b91c1c" stroke-width="1.3" marker-end="url(#arrowr)"/><text x="600" y="226" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#b91c1c" text-anchor="start" font-weight="normal" font-style="normal">no</text><path d="M400 260 L 400 292" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><text x="408" y="279.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">yes</text><rect x="250" y="292" width="300" height="56" rx="14" fill="#ffffff" fill-opacity="1.0" stroke="#1e3a8a" stroke-width="1.4"/><text x="400.0" y="317.95" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Read magic bytes</text><text x="400.0" y="335.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">%PDF · PK\x03\x04 + word/document.xml · OLE</text><path d="M400 348 L 400 380" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><polygon points="400,380.0 455.0,406 400,432.0 345.0,406" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="400" y="403" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">a supported</text><text x="400" y="414" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">format?</text><path d="M455 406 L 760 406" fill="none" stroke="#b91c1c" stroke-width="1.3" marker-end="url(#arrowr)"/><text x="600" y="398" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#b91c1c" text-anchor="start" font-weight="normal" font-style="normal">no</text><path d="M400 432 L 400 464" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><text x="408" y="451.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">yes</text><rect x="250" y="464" width="300" height="56" rx="14" fill="#ffffff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/><text x="400.0" y="489.95" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Extract text</text><text x="400.0" y="507.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">unpdf or mammoth, page and char capped</text><path d="M400 520 L 400 552" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="160" y="552" width="480" height="236" rx="10" fill="#fef2f2" fill-opacity="0.5" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="6 4"/><text x="172" y="572" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="bold" font-style="normal">deidentify() — order is load-bearing</text><rect x="180" y="582" width="440" height="52" rx="14" fill="#fee2e2" fill-opacity="1.0" stroke="#b91c1c" stroke-width="1.4"/><text x="400.0" y="605.95" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">1. Redact South African ID numbers</text><text x="400.0" y="623.9000000000001" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">Luhn checksum + YYMMDD plausibility, then replace</text><path d="M400 634 L 400 650" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="180" y="650" width="440" height="52" rx="14" fill="#fee2e2" fill-opacity="1.0" stroke="#b91c1c" stroke-width="1.4"/><text x="400.0" y="673.95" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">2. Withhold the header block</text><text x="400.0" y="691.9000000000001" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">name, email, phone and remaining header lines</text><path d="M400 702 L 400 718" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="180" y="718" width="440" height="52" rx="14" fill="#fee2e2" fill-opacity="1.0" stroke="#b91c1c" stroke-width="1.4"/><text x="400.0" y="741.95" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">3. Scrub residual identifiers</text><text x="400.0" y="759.9000000000001" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">anything the header split missed</text><path d="M400 788 L 400 812" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="210" y="812" width="380" height="56" rx="14" fill="#ede9fe" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.4"/><text x="400.0" y="837.95" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Encrypt the identity header</text><text x="400.0" y="855.9000000000001" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">AES-256-GCM, fresh IV per record</text><path d="M400 868 L 400 892" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="210" y="892" width="380" height="56" rx="14" fill="#dcfce7" fill-opacity="1.0" stroke="#15803d" stroke-width="1.4"/><text x="400.0" y="917.95" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Persist de-identified content + ciphertext</text><text x="400.0" y="935.9000000000001" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">the original file is discarded, never stored</text><path d="M400 948 L 400 966" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><circle cx="400" cy="978" r="12" fill="none" stroke="#0f172a" stroke-width="1.4"/><circle cx="400" cy="978" r="7" fill="#0f172a" stroke="#0f172a" stroke-width="1.2"/><rect x="760" y="206" width="230" height="56" rx="6" fill="#fee2e2" fill-opacity="1.0" stroke="#b91c1c" stroke-width="1.4"/><text x="875.0" y="224.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Reject</text><text x="875.0" y="244.125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">UnsupportedFileError, with a message the</text><text x="875.0" y="257.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">user can act on</text><path d="M875 262 L 875 380" fill="none" stroke="#b91c1c" stroke-width="1.3" stroke-dasharray="4 4"/><rect x="760" y="380" width="230" height="52" rx="6" fill="#fee2e2" fill-opacity="1.0" stroke="#b91c1c" stroke-width="1.4"/><text x="875.0" y="403.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Reject</text><text x="875.0" y="422.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">nothing is parsed or stored</text><path d="M700 560 h277 l13 13 v56.19999999999999 h-290 z" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><path d="M977 560 v13 h13 z" fill="#b91c1c" fill-opacity="0.25" stroke="#b91c1c" stroke-width="1.2"/><text x="710" y="576.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">The ID number is redacted BEFORE the header split.</text><text x="710" y="589.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">Reversing the two would let an ID number sitting in the</text><text x="710" y="602.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">header survive into the withheld block, where nothing</text><text x="710" y="615.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">redacts it.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 760" width="1020" height="760"><title>Defence in depth</title><defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#475569"/></marker>
  <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#2563eb"/></marker>
  <marker id="arrowv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#7c3aed"/></marker>
  <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#b91c1c"/></marker>
  <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9" fill="none" stroke="#475569" stroke-width="1.4"/></marker>
  <marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#475569" stroke-width="1.3"/></marker>
  <marker id="hollowv" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/></marker>
  <marker id="diamond" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
    <path d="M0,5 L6.5,1 L13,5 L6.5,9 z" fill="#ffffff" stroke="#475569" stroke-width="1.2"/></marker>
  <marker id="filldiamond" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
    <path d="M0,5 L6.5,1 L13,5 L6.5,9 z" fill="#475569"/></marker>
</defs><rect width="1020" height="760" fill="#ffffff"/><text x="510" y="30" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Defence in depth — every control an attacker must pass</text><text x="510" y="50" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">Independent layers. A bug in application logic cannot read another user’s rows, because the database refuses separately.</text><rect x="40" y="80" width="940" height="62" rx="8" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/><text x="58" y="116" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Transport</text><text x="236" y="114.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">HTTPS · HSTS with preload · upgrade-insecure-requests</text><rect x="50" y="150" width="920" height="62" rx="8" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/><text x="68" y="186" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Browser policy</text><text x="246" y="184.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">CSP with a per-request nonce and strict-dynamic · X-Frame-Options DENY · nosniff · Referrer-Policy · Permissions-Policy · COOP · CORP</text><rect x="60" y="220" width="900" height="62" rx="8" fill="#fef3c7" fill-opacity="1.0" stroke="#b45309" stroke-width="1.4"/><text x="78" y="256" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Session</text><text x="256" y="254.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">getClaims() verifies the JWT signature. getSession() reads a cookie and is not trusted for authorisation.</text><rect x="70" y="290" width="880" height="62" rx="8" fill="#fef3c7" fill-opacity="1.0" stroke="#b45309" stroke-width="1.4"/><text x="88" y="326" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Application gate</text><text x="266" y="324.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">lib/dal.ts — requireUser, requireConsentedUser, reverifyForDestructiveAction. A missing id returns 404, never 403.</text><rect x="80" y="360" width="860" height="62" rx="8" fill="#ede9fe" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.4"/><text x="98" y="396" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Input validation</text><text x="276" y="394.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">Magic bytes not MIME type · 5 MB cap · 30-page cap · Zod at every boundary including the model’s reply</text><rect x="90" y="430" width="840" height="62" rx="8" fill="#ede9fe" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.4"/><text x="108" y="466" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Rate limiting</text><text x="286" y="464.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">Postgres SECURITY DEFINER counter. Caller taken from auth.uid(), never from an argument. Fails closed.</text><rect x="100" y="500" width="820" height="62" rx="8" fill="#dcfce7" fill-opacity="1.0" stroke="#15803d" stroke-width="1.4"/><text x="118" y="536" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Row-Level Security</text><text x="296" y="534.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">Enabled on all 8 tables. rate_limits has zero policies, so every statement against it is denied.</text><rect x="110" y="570" width="800" height="62" rx="8" fill="#dcfce7" fill-opacity="1.0" stroke="#15803d" stroke-width="1.4"/><text x="128" y="606" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Encryption at rest</text><text x="306" y="604.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">AES-256-GCM on name, email and phone, applied in the application. A stolen dump yields ciphertext.</text><rect x="120" y="640" width="780" height="62" rx="8" fill="#fee2e2" fill-opacity="1.0" stroke="#b91c1c" stroke-width="1.4"/><text x="138" y="676" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Data minimisation</text><text x="316" y="674.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">No id_number column exists. The original upload is never stored. 12-month retention purge runs daily.</text><path d="M22 100 L 22 700" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowr)"/><text transform="translate(16 400) rotate(-90)" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-weight="bold">an attacker must pass every layer</text></svg>
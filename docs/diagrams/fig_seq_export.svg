<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 680" width="1020" height="680"><title>Sequence — export</title><defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#475569"/></marker>
  <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#2563eb"/></marker>
  <marker id="arrowv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#7c3aed"/></marker>
  <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#b91c1c"/></marker>
  <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9" fill="none" stroke="#475569" stroke-width="1.4"/></marker>
  <marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#475569" stroke-width="1.3"/></marker>
  <marker id="hollowv" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/></marker>
  <marker id="diamond" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
    <path d="M0,5 L6.5,1 L13,5 L6.5,9 z" fill="#ffffff" stroke="#475569" stroke-width="1.2"/></marker>
  <marker id="filldiamond" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
    <path d="M0,5 L6.5,1 L13,5 L6.5,9 z" fill="#475569"/></marker>
</defs><rect width="1020" height="680" fill="#ffffff"/><text x="510" y="28" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Sequence diagram — exporting a tailored CV</text><text x="510" y="48" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">The route takes three inputs and none of them is content. The document is rebuilt server-side from the stored report.</text><rect x="19.0" y="86" width="142" height="48" rx="6" fill="#f1f5f9" fill-opacity="1.0" stroke="#0f172a" stroke-width="1.4"/><text x="90.0" y="108.1125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Job Seeker</text><text x="90.0" y="125.4125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">browser</text><line x1="90" y1="134" x2="90" y2="640" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="5 5"/><rect x="184.0" y="86" width="168" height="48" rx="6" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/><text x="268.0" y="108.1125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">GET /api/export/[id]</text><text x="268.0" y="125.4125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">Route Handler</text><line x1="268" y1="134" x2="268" y2="640" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="5 5"/><rect x="377.0" y="86" width="150" height="48" rx="6" fill="#dcfce7" fill-opacity="1.0" stroke="#15803d" stroke-width="1.4"/><text x="452.0" y="108.1125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Supabase</text><text x="452.0" y="125.4125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">PostgreSQL + RLS</text><line x1="452" y1="134" x2="452" y2="640" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="5 5"/><rect x="558.0" y="86" width="176" height="48" rx="6" fill="#ede9fe" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.4"/><text x="646.0" y="108.1125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">assembleResumeDocument()</text><text x="646.0" y="125.4125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">domain — the single gate</text><line x1="646" y1="134" x2="646" y2="640" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="5 5"/><rect x="772.0" y="86" width="160" height="48" rx="6" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/><text x="852.0" y="108.1125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">pdf / docx renderer</text><text x="852.0" y="125.4125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">infrastructure</text><line x1="852" y1="134" x2="852" y2="640" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="5 5"/><line x1="96" y1="168" x2="262" y2="168" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><text x="179.0" y="162" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">id + format + templateId</text><rect x="262" y="162" width="12" height="400" rx="0" fill="#ffffff" fill-opacity="1.0" stroke="#475569" stroke-width="1.1"/><path d="M274 200 h26 v22 h-26" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><text x="306" y="206" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">requireConsentedUser()</text><text x="306" y="219" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="italic">no session → 404, never 403</text><line x1="274" y1="246" x2="446" y2="246" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><text x="360.0" y="240" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">getTailoring(id)</text><rect x="446" y="240" width="12" height="44" rx="0" fill="#dcfce7" fill-opacity="1.0" stroke="#15803d" stroke-width="1.1"/><line x1="446" y1="274" x2="274" y2="274" stroke="#475569" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/><text x="360.0" y="268" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">draft · report · approvedClaims</text><text x="360.0" y="284" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="italic">another user’s id returns null — RLS refuses</text><line x1="274" y1="314" x2="446" y2="314" stroke="#b91c1c" stroke-width="1.3" marker-end="url(#arrow)"/><text x="360.0" y="308" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">getIdentity(resumeId)</text><rect x="446" y="308" width="12" height="44" rx="0" fill="#fee2e2" fill-opacity="1.0" stroke="#b91c1c" stroke-width="1.1"/><line x1="446" y1="342" x2="274" y2="342" stroke="#b91c1c" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/><text x="360.0" y="336" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">AES-256-GCM ciphertext</text><path d="M274 368 h26 v22 h-26" fill="none" stroke="#b91c1c" stroke-width="1.3" marker-end="url(#arrow)"/><text x="306" y="374" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">decryptIdentityHeader()</text><text x="306" y="387" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#b91c1c" text-anchor="start" font-weight="normal" font-style="italic">auth tag verified — tampering throws</text><line x1="274" y1="420" x2="640" y2="420" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arrow)"/><text x="457.0" y="414" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">assemble(identity, draft, report, approved)</text><rect x="640" y="414" width="12" height="74" rx="0" fill="#ede9fe" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.1"/><path d="M652 446 h20 v22 h-20" fill="none" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arrow)"/><text x="678" y="452" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">skills read from report, never from draft.skills</text><line x1="640" y1="492" x2="274" y2="492" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/><text x="457.0" y="486" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">ResumeDocument + omissions</text><line x1="274" y1="522" x2="846" y2="522" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><text x="560.0" y="516" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">render(document, template)</text><rect x="846" y="516" width="12" height="44" rx="0" fill="#ffffff" fill-opacity="1.0" stroke="#475569" stroke-width="1.1"/><line x1="846" y1="550" x2="274" y2="550" stroke="#475569" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/><text x="560.0" y="544" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">bytes — no tables, images, headers or footers</text><line x1="262" y1="580" x2="96" y2="580" stroke="#475569" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/><text x="179.0" y="574" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">Content-Disposition: attachment</text><path d="M30 604 h457 l13 13 v29.599999999999994 h-470 z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><path d="M487 604 v13 h13 z" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="1.2"/><text x="40" y="620.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">A caller who controls every parameter still cannot put a blocked claim into a file, because no</text><text x="40" y="633.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">parameter carries content.</text><path d="M520 604 h457 l13 13 v29.599999999999994 h-470 z" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/><path d="M977 604 v13 h13 z" fill="#15803d" fill-opacity="0.25" stroke="#15803d" stroke-width="1.2"/><text x="530" y="620.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">The preview and the download are produced by the same function, so what the user reviewed</text><text x="530" y="633.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">and what they send cannot drift apart.</text></svg>
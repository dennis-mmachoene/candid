<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 780" width="1020" height="780"><title>Deployment diagram</title><defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#475569"/></marker>
  <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#2563eb"/></marker>
  <marker id="arrowv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#7c3aed"/></marker>
  <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#b91c1c"/></marker>
  <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9" fill="none" stroke="#475569" stroke-width="1.4"/></marker>
  <marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#475569" stroke-width="1.3"/></marker>
  <marker id="hollowv" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/></marker>
  <marker id="diamond" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
    <path d="M0,5 L6.5,1 L13,5 L6.5,9 z" fill="#ffffff" stroke="#475569" stroke-width="1.2"/></marker>
  <marker id="filldiamond" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
    <path d="M0,5 L6.5,1 L13,5 L6.5,9 z" fill="#475569"/></marker>
</defs><rect width="1020" height="780" fill="#ffffff"/><text x="510" y="30" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Deployment diagram — components hosted on separate machines</text><text x="510" y="50" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">Four independent execution environments in three jurisdictions. No two components share a host.</text><path d="M40 110 l14 -14 h210 v176 l-14 14 z" fill="#f1f5f9" fill-opacity="0.5" stroke="#0f172a" stroke-width="1.4"/><path d="M250 96 v176 l-14 14" fill="none" stroke="#0f172a" stroke-width="1.4"/><rect x="40" y="110" width="210" height="176" rx="0" fill="#f1f5f9" fill-opacity="1.0" stroke="#0f172a" stroke-width="1.4"/><text x="145.0" y="130" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">«device»</text><text x="145.0" y="147" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">User device</text><rect x="56" y="158" width="178" height="52" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#94a3b8" stroke-width="1.4"/><text x="145.0" y="176.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Web browser</text><text x="145.0" y="192.85" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">Chrome, Safari, Firefox</text><text x="145.0" y="204.325" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">320px to 2560px</text><rect x="56" y="220" width="178" height="52" rx="6" fill="#dcfce7" fill-opacity="1.0" stroke="#15803d" stroke-width="1.4"/><text x="145.0" y="243.9375" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Downloaded CV</text><text x="145.0" y="260.5875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">PDF or DOCX, on disk</text><path d="M300 110 l14 -14 h240 v260 l-14 14 z" fill="#dbeafe" fill-opacity="0.5" stroke="#2563eb" stroke-width="1.4"/><path d="M540 96 v260 l-14 14" fill="none" stroke="#2563eb" stroke-width="1.4"/><rect x="300" y="110" width="240" height="260" rx="0" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/><text x="420.0" y="130" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">«execution environment»</text><text x="420.0" y="147" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Vercel Edge + Node</text><rect x="316" y="158" width="208" height="52" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/><text x="420.0" y="176.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Next.js 15.5.22</text><text x="420.0" y="192.85" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">middleware · Server Components</text><text x="420.0" y="204.325" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">Server Actions · Route Handlers</text><rect x="316" y="220" width="208" height="52" rx="6" fill="#ede9fe" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.4"/><text x="420.0" y="238.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Domain layer</text><text x="420.0" y="254.85" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">the two guarantees</text><text x="420.0" y="266.325" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">pure, no network</text><rect x="316" y="282" width="208" height="52" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/><text x="420.0" y="305.9375" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Adapters</text><text x="420.0" y="322.5875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">parser · crypto · renderers</text><path d="M590 110 l14 -14 h200 v260 l-14 14 z" fill="#dcfce7" fill-opacity="0.5" stroke="#15803d" stroke-width="1.4"/><path d="M790 96 v260 l-14 14" fill="none" stroke="#15803d" stroke-width="1.4"/><rect x="590" y="110" width="200" height="260" rx="0" fill="#dcfce7" fill-opacity="1.0" stroke="#15803d" stroke-width="1.4"/><text x="690.0" y="130" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">«PaaS — EU region»</text><text x="690.0" y="147" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Supabase</text><rect x="604" y="158" width="172" height="52" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#15803d" stroke-width="1.4"/><text x="690.0" y="181.9375" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">PostgreSQL 15</text><text x="690.0" y="198.5875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">8 tables, RLS on all</text><rect x="604" y="220" width="172" height="52" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#15803d" stroke-width="1.4"/><text x="690.0" y="243.9375" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">GoTrue Auth</text><text x="690.0" y="260.5875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">JWT issuance, OAuth</text><rect x="604" y="282" width="172" height="52" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#15803d" stroke-width="1.4"/><text x="690.0" y="305.9375" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">pg_cron</text><text x="690.0" y="322.5875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">retention purge, 03:15 UTC</text><path d="M840 110 l14 -14 h150 v112 l-14 14 z" fill="#ede9fe" fill-opacity="0.5" stroke="#7c3aed" stroke-width="1.4"/><path d="M990 96 v112 l-14 14" fill="none" stroke="#7c3aed" stroke-width="1.4"/><rect x="840" y="110" width="150" height="112" rx="0" fill="#ede9fe" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.4"/><text x="915.0" y="130" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">«external API — US»</text><text x="915.0" y="147" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Anthropic</text><rect x="852" y="156" width="126" height="52" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.4"/><text x="915.0" y="179.9375" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Claude API</text><text x="915.0" y="196.5875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">receives NO identity</text><path d="M840 258 l14 -14 h150 v112 l-14 14 z" fill="#fef3c7" fill-opacity="0.5" stroke="#b45309" stroke-width="1.4"/><path d="M990 244 v112 l-14 14" fill="none" stroke="#b45309" stroke-width="1.4"/><rect x="840" y="258" width="150" height="112" rx="0" fill="#fef3c7" fill-opacity="1.0" stroke="#b45309" stroke-width="1.4"/><text x="915.0" y="278" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">«external IdP — US»</text><text x="915.0" y="295" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Google</text><rect x="852" y="304" width="126" height="52" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#b45309" stroke-width="1.4"/><text x="915.0" y="327.9375" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">OAuth 2.0</text><text x="915.0" y="344.5875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">identity assertion</text><line x1="250" y1="196" x2="300" y2="196" stroke="#475569" stroke-width="1.5"/><text x="275.0" y="189" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="bold" font-style="normal">«HTTPS»</text><line x1="540" y1="196" x2="590" y2="196" stroke="#15803d" stroke-width="1.5"/><text x="565.0" y="189" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">«HTTPS»</text><line x1="790" y1="168" x2="840" y2="168" stroke="#7c3aed" stroke-width="1.5"/><text x="815.0" y="161" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#7c3aed" text-anchor="middle" font-weight="bold" font-style="normal">«HTTPS»</text><line x1="790" y1="314" x2="840" y2="314" stroke="#b45309" stroke-width="1.5"/><text x="815.0" y="307" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#b45309" text-anchor="middle" font-weight="bold" font-style="normal">«OIDC»</text><path d="M40 420 h447 l13 13 v59.0 h-460 z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><path d="M487 420 v13 h13 z" fill="#2563eb" fill-opacity="0.25" stroke="#2563eb" stroke-width="1.2"/><text x="50" y="436.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">The study guide requires components hosted on different machines. Four hold here: the</text><text x="50" y="450.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">browser, Vercel’s serverless runtime, Supabase’s managed Postgres, and two</text><text x="50" y="464.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">third-party APIs. They are separately owned, separately scaled, and separately</text><text x="50" y="478.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">reachable.</text><path d="M520 420 h457 l13 13 v45.0 h-470 z" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><path d="M977 420 v13 h13 z" fill="#b45309" fill-opacity="0.25" stroke="#b45309" stroke-width="1.2"/><text x="530" y="436.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">POPIA §72 governs cross-border transfer. Supabase is EU-hosted; Anthropic, Google and</text><text x="530" y="450.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">Vercel are US-hosted. Every one is named in the consent record the user accepts,</text><text x="530" y="464.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">together with whether it receives identifying data.</text><rect x="40" y="542" width="950" height="200" rx="8" fill="#f1f5f9" fill-opacity="1.0" stroke="#94a3b8" stroke-width="1.2"/><text x="56" y="566" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Data crossing each link</text><text x="64" y="592" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Browser → Vercel</text><text x="230" y="592" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">form data, session cookie</text><text x="650" y="592" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="normal" font-style="italic">identifying (the user’s own)</text><text x="64" y="620" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Vercel → Supabase</text><text x="230" y="620" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">de-identified CV text + AES-256-GCM ciphertext</text><text x="650" y="620" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="normal" font-style="italic">ciphertext only for name, email, phone</text><text x="64" y="648" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Vercel → Anthropic</text><text x="230" y="648" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">de-identified CV text + the job advert</text><text x="650" y="648" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="normal" font-style="italic">NO name, email, phone or ID number</text><text x="64" y="676" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Vercel → Google</text><text x="230" y="676" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">OAuth authorisation request</text><text x="650" y="676" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="normal" font-style="italic">no CV data whatsoever</text><text x="64" y="704" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Supabase → Vercel</text><text x="230" y="704" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">rows the caller’s RLS policy permits</text><text x="650" y="704" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="normal" font-style="italic">never another user’s rows</text></svg>
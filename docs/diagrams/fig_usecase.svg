<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 840" width="1020" height="840"><title>Use case diagram</title><defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#475569"/></marker>
  <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#2563eb"/></marker>
  <marker id="arrowv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#7c3aed"/></marker>
  <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#b91c1c"/></marker>
  <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9" fill="none" stroke="#475569" stroke-width="1.4"/></marker>
  <marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#475569" stroke-width="1.3"/></marker>
  <marker id="hollowv" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/></marker>
  <marker id="diamond" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
    <path d="M0,5 L6.5,1 L13,5 L6.5,9 z" fill="#ffffff" stroke="#475569" stroke-width="1.2"/></marker>
  <marker id="filldiamond" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
    <path d="M0,5 L6.5,1 L13,5 L6.5,9 z" fill="#475569"/></marker>
</defs><rect width="1020" height="840" fill="#ffffff"/><text x="510" y="30" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Use case diagram — Candid</text><text x="510" y="50" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">The primary actor is the job seeker. Every other actor is a secondary system the boundary depends on.</text><rect x="238" y="72" width="500" height="740" rx="10" fill="#fbfcfe" fill-opacity="1.0" stroke="#1e3a8a" stroke-width="1.6"/><text x="488" y="96" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#1e3a8a" text-anchor="middle" font-weight="bold" font-style="normal">Candid</text><ellipse cx="470" cy="150" rx="168" ry="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><text x="470" y="150" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Sign in with Google</text><ellipse cx="470" cy="222" rx="168" ry="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><text x="470" y="218" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Give POPIA consent</text><text x="470" y="233" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">policy version recorded</text><ellipse cx="470" cy="294" rx="168" ry="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><text x="470" y="290" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Upload a CV</text><text x="470" y="305" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">PDF or DOCX, magic-byte checked</text><ellipse cx="470" cy="378" rx="168" ry="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><text x="470" y="374" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Tailor CV to a job advert</text><text x="470" y="389" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">the only paid operation</text><ellipse cx="470" cy="462" rx="168" ry="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><text x="470" y="458" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Review the integrity report</text><text x="470" y="473" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">accepted / borderline / blocked</text><ellipse cx="470" cy="534" rx="168" ry="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><text x="470" y="534" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Approve a borderline claim</text><ellipse cx="470" cy="606" rx="168" ry="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><text x="470" y="602" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Export as PDF or Word</text><text x="470" y="617" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">ATS-parseable by construction</text><ellipse cx="470" cy="668" rx="168" ry="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><text x="470" y="668" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">View and delete history</text><ellipse cx="470" cy="716" rx="168" ry="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><text x="470" y="712" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Delete account and all data</text><text x="470" y="727" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">POPIA §24</text><circle cx="112" cy="394" r="9" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/><line x1="112" y1="403" x2="112" y2="426" stroke="#0f172a" stroke-width="1.6"/><line x1="99" y1="412" x2="125" y2="412" stroke="#0f172a" stroke-width="1.6"/><line x1="112" y1="426" x2="101" y2="442" stroke="#0f172a" stroke-width="1.6"/><line x1="112" y1="426" x2="123" y2="442" stroke="#0f172a" stroke-width="1.6"/><text x="112" y="458" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Job Seeker</text><text x="112" y="472" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">primary actor</text><line x1="140" y1="420" x2="306" y2="150" stroke="#94a3b8" stroke-width="1.0"/><line x1="140" y1="420" x2="306" y2="222" stroke="#94a3b8" stroke-width="1.0"/><line x1="140" y1="420" x2="306" y2="294" stroke="#94a3b8" stroke-width="1.0"/><line x1="140" y1="420" x2="306" y2="378" stroke="#94a3b8" stroke-width="1.0"/><line x1="140" y1="420" x2="306" y2="462" stroke="#94a3b8" stroke-width="1.0"/><line x1="140" y1="420" x2="306" y2="534" stroke="#94a3b8" stroke-width="1.0"/><line x1="140" y1="420" x2="306" y2="606" stroke="#94a3b8" stroke-width="1.0"/><line x1="140" y1="420" x2="306" y2="668" stroke="#94a3b8" stroke-width="1.0"/><line x1="140" y1="420" x2="306" y2="716" stroke="#94a3b8" stroke-width="1.0"/><circle cx="900" cy="134" r="9" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/><line x1="900" y1="143" x2="900" y2="166" stroke="#0f172a" stroke-width="1.6"/><line x1="887" y1="152" x2="913" y2="152" stroke="#0f172a" stroke-width="1.6"/><line x1="900" y1="166" x2="889" y2="182" stroke="#0f172a" stroke-width="1.6"/><line x1="900" y1="166" x2="911" y2="182" stroke="#0f172a" stroke-width="1.6"/><text x="900" y="198" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Google</text><text x="900" y="212" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">«system» identity provider</text><circle cx="900" cy="354" r="9" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/><line x1="900" y1="363" x2="900" y2="386" stroke="#0f172a" stroke-width="1.6"/><line x1="887" y1="372" x2="913" y2="372" stroke="#0f172a" stroke-width="1.6"/><line x1="900" y1="386" x2="889" y2="402" stroke="#0f172a" stroke-width="1.6"/><line x1="900" y1="386" x2="911" y2="402" stroke="#0f172a" stroke-width="1.6"/><text x="900" y="418" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Claude API</text><text x="900" y="432" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">«system» Anthropic</text><circle cx="900" cy="594" r="9" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/><line x1="900" y1="603" x2="900" y2="626" stroke="#0f172a" stroke-width="1.6"/><line x1="887" y1="612" x2="913" y2="612" stroke="#0f172a" stroke-width="1.6"/><line x1="900" y1="626" x2="889" y2="642" stroke="#0f172a" stroke-width="1.6"/><line x1="900" y1="626" x2="911" y2="642" stroke="#0f172a" stroke-width="1.6"/><text x="900" y="658" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">pg_cron</text><text x="900" y="672" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">«system» scheduler</text><line x1="866" y1="160" x2="636" y2="150" stroke="#94a3b8" stroke-width="1.0"/><line x1="866" y1="380" x2="636" y2="378" stroke="#94a3b8" stroke-width="1.0"/><path d="M630 386 C 690 400 690 448 630 458" fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/><text x="700" y="424" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#7c3aed" text-anchor="start" font-weight="normal" font-style="italic">«include»</text><path d="M620 528 C 660 512 660 480 620 468" fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/><text x="668" y="500" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#7c3aed" text-anchor="start" font-weight="normal" font-style="italic">«extend»</text><ellipse cx="470" cy="776" rx="168" ry="24" fill="#f1f5f9" stroke="#475569" stroke-width="1.3"/><text x="470" y="780" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">Purge inactive data (12 months)</text><line x1="866" y1="620" x2="632" y2="772" stroke="#94a3b8" stroke-width="1.0"/><path d="M30 560 h177 l13 13 v56.19999999999999 h-190 z" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><path d="M207 560 v13 h13 z" fill="#b45309" fill-opacity="0.25" stroke="#b45309" stroke-width="1.2"/><text x="40" y="576.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">Consent gates everything below it.</text><text x="40" y="589.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">A user who has not accepted the</text><text x="40" y="602.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">current policy version cannot reach</text><text x="40" y="615.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">any use case that processes a CV.</text><path d="M752 676 h237 l13 13 v42.9 h-250 z" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><path d="M989 676 v13 h13 z" fill="#475569" fill-opacity="0.25" stroke="#475569" stroke-width="1.2"/><text x="762" y="692.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">Retention is scheduled, not requested.</text><text x="762" y="705.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">purge_inactive_data() runs daily at 03:15 UTC</text><text x="762" y="718.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">and needs no actor.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 660" width="1020" height="660"><title>Context and trust boundary</title><defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#475569"/></marker>
  <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#2563eb"/></marker>
  <marker id="arrowv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#7c3aed"/></marker>
  <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#b91c1c"/></marker>
  <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9" fill="none" stroke="#475569" stroke-width="1.4"/></marker>
  <marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#475569" stroke-width="1.3"/></marker>
  <marker id="hollowv" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/></marker>
  <marker id="diamond" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
    <path d="M0,5 L6.5,1 L13,5 L6.5,9 z" fill="#ffffff" stroke="#475569" stroke-width="1.2"/></marker>
  <marker id="filldiamond" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
    <path d="M0,5 L6.5,1 L13,5 L6.5,9 z" fill="#475569"/></marker>
</defs><rect width="1020" height="660" fill="#ffffff"/><text x="510" y="30" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Context diagram — what crosses the trust boundary</text><text x="510" y="50" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">Guarantee 1 stated as a data flow. Identity stops at the server; only de-identified text leaves it.</text><rect x="250" y="84" width="520" height="380" rx="12" fill="#fbfcfe" fill-opacity="1.0" stroke="#1e3a8a" stroke-width="1.8" stroke-dasharray="8 5"/><text x="510" y="108" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#1e3a8a" text-anchor="middle" font-weight="bold" font-style="normal">TRUST BOUNDARY — Candid server (Vercel)</text><rect x="288" y="128" width="444" height="60" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/><text x="510.0" y="155.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Parser</text><text x="510.0" y="174.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">magic bytes → text, in memory only</text><rect x="288" y="208" width="444" height="74" rx="6" fill="#fee2e2" fill-opacity="1.0" stroke="#b91c1c" stroke-width="1.4"/><text x="510.0" y="242.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">deidentify()</text><text x="510.0" y="261.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">redact SA ID numbers → withhold header block → scrub residuals</text><rect x="288" y="302" width="210" height="60" rx="6" fill="#fee2e2" fill-opacity="1.0" stroke="#b91c1c" stroke-width="1.4"/><text x="393.0" y="329.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Identity header</text><text x="393.0" y="348.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">AES-256-GCM at rest</text><rect x="522" y="302" width="210" height="60" rx="6" fill="#dcfce7" fill-opacity="1.0" stroke="#15803d" stroke-width="1.4"/><text x="627.0" y="329.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">De-identified content</text><text x="627.0" y="348.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">the only text that may leave</text><rect x="288" y="382" width="444" height="60" rx="6" fill="#ede9fe" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.4"/><text x="510.0" y="409.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">validator + assembler</text><text x="510.0" y="428.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">judge the reply, build the document, reattach identity</text><rect x="40" y="128" width="180" height="60" rx="6" fill="#f1f5f9" fill-opacity="1.0" stroke="#0f172a" stroke-width="1.4"/><text x="130.0" y="155.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Job seeker</text><text x="130.0" y="174.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">uploads a CV</text><rect x="40" y="382" width="180" height="60" rx="6" fill="#f1f5f9" fill-opacity="1.0" stroke="#0f172a" stroke-width="1.4"/><text x="130.0" y="409.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Job seeker</text><text x="130.0" y="428.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">downloads the CV</text><rect x="800" y="302" width="180" height="60" rx="6" fill="#ede9fe" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.4"/><text x="890.0" y="329.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Claude API</text><text x="890.0" y="348.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">Anthropic, United States</text><rect x="800" y="128" width="180" height="60" rx="6" fill="#dcfce7" fill-opacity="1.0" stroke="#15803d" stroke-width="1.4"/><text x="890.0" y="155.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Supabase</text><text x="890.0" y="174.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">PostgreSQL, EU</text><path d="M220 158 L 288 158" fill="none" stroke="#b91c1c" stroke-width="1.3" marker-end="url(#arrowr)"/><text x="254" y="150" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle" font-weight="normal" font-style="normal">full CV</text><path d="M510 188 L 510 208" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M393 282 L 393 302" fill="none" stroke="#b91c1c" stroke-width="1.3" marker-end="url(#arrowr)"/><path d="M627 282 L 627 302" fill="none" stroke="#15803d" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M732 332 L 800 332" fill="none" stroke="#15803d" stroke-width="1.3" marker-end="url(#arrow)"/><text x="766" y="324" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#15803d" text-anchor="middle" font-weight="normal" font-style="normal">de-identified</text><path d="M800 348 L 736 348" fill="none" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arrowv)"/><text x="766" y="364" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#7c3aed" text-anchor="middle" font-weight="normal" font-style="normal">draft</text><path d="M498 332 L 522 332" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3"/><path d="M732 158 L 800 158" fill="none" stroke="#15803d" stroke-width="1.3" marker-end="url(#arrow)"/><text x="766" y="150" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#15803d" text-anchor="middle" font-weight="normal" font-style="normal">ciphertext</text><path d="M288 412 L 220 412" fill="none" stroke="#b91c1c" stroke-width="1.3" marker-end="url(#arrowr)"/><text x="254" y="404" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle" font-weight="normal" font-style="normal">PDF / DOCX</text><path d="M393 362 L 393 382" fill="none" stroke="#b91c1c" stroke-width="1.3" marker-end="url(#arrowr)"/><path d="M627 362 L 627 382" fill="none" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arrowv)"/><line x1="770" y1="284" x2="800" y2="284" stroke="#b91c1c" stroke-width="0"/><circle cx="766" cy="262" r="15" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><line x1="757" y1="253" x2="775" y2="271" stroke="#b91c1c" stroke-width="2.4"/><text x="766" y="240" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#b91c1c" text-anchor="middle" font-weight="bold" font-style="normal">identity never crosses here</text><path d="M40 500 h447 l13 13 v45.0 h-460 z" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><path d="M487 500 v13 h13 z" fill="#b91c1c" fill-opacity="0.25" stroke="#b91c1c" stroke-width="1.2"/><text x="50" y="516.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">The original uploaded file is discarded after parsing. Keeping it would mean keeping the</text><text x="50" y="530.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">unredacted ID number and full contact details, which is precisely the thing the product</text><text x="50" y="544.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">promises not to do.</text><path d="M520 500 h447 l13 13 v31.0 h-460 z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><path d="M967 500 v13 h13 z" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="1.2"/><text x="530" y="516.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">The AIProvider port has no field for a name, an email, a phone number or an ID number.</text><text x="530" y="530.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">Passing one is a compile error, not an oversight a reviewer has to catch.</text></svg>
</defs><rect width="1020" height="720" fill="#ffffff"/><text x="510" y="30" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Component diagram — provided and required interfaces</text><text x="510" y="50" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">The domain requires four interfaces it owns. Each is provided by exactly one adapter, and swapping an adapter changes no business rule.</text><rect x="300" y="96" width="420" height="132" rx="5" fill="#ede9fe" fill-opacity="1.0" stroke="#5b21b6" stroke-width="1.5"/><rect x="686" y="106" width="22" height="14" rx="2" fill="#ede9fe" fill-opacity="1.0" stroke="#5b21b6" stroke-width="1.2"/><rect x="680" y="109" width="12" height="4" rx="0" fill="#ede9fe" fill-opacity="1.0" stroke="#5b21b6" stroke-width="1.1"/><rect x="680" y="115" width="12" height="4" rx="0" fill="#ede9fe" fill-opacity="1.0" stroke="#5b21b6" stroke-width="1.1"/><text x="314" y="118" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">«component»</text><text x="314" y="136" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Candid.Domain</text><text x="314" y="154.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">The two guarantees. Pure TypeScript — no vendor SDK, no framework, no I/O.</text><text x="314" y="166.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">Requires four interfaces it declares itself in ports.ts.</text><rect x="60" y="300" width="180" height="140" rx="5" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.5"/><rect x="206" y="310" width="22" height="14" rx="2" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.2"/><rect x="200" y="313" width="12" height="4" rx="0" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.1"/><rect x="200" y="319" width="12" height="4" rx="0" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.1"/><text x="74" y="322" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">«component»</text><text x="74" y="340" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Candid.AI</text><text x="74" y="358.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">ClaudeProvider over</text><text x="74" y="370.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">@anthropic-ai/sdk 0.115.0.</text><text x="74" y="383.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">Structured outputs via</text><text x="74" y="395.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">messages.parse() and</text><text x="74" y="408.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">zodOutputFormat.</text><line x1="150" y1="300" x2="150" y2="262" stroke="#2563eb" stroke-width="1.4"/><circle cx="150" cy="253" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><text x="150" y="282" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#1e3a8a" text-anchor="middle" font-weight="bold" font-style="normal">AIProvider</text><rect x="300" y="300" width="180" height="140" rx="5" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.5"/><rect x="446" y="310" width="22" height="14" rx="2" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.2"/><rect x="440" y="313" width="12" height="4" rx="0" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.1"/><rect x="440" y="319" width="12" height="4" rx="0" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.1"/><text x="314" y="322" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">«component»</text><text x="314" y="340" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Candid.Parsing</text><text x="314" y="358.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">PdfDocxParser over unpdf and</text><text x="314" y="370.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">mammoth. Format from magic</text><text x="314" y="383.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">bytes, never from the</text><text x="314" y="395.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">browser’s MIME type.</text><line x1="390" y1="300" x2="390" y2="262" stroke="#2563eb" stroke-width="1.4"/><circle cx="390" cy="253" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><text x="390" y="282" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#1e3a8a" text-anchor="middle" font-weight="bold" font-style="normal">CvParser</text><rect x="540" y="300" width="180" height="140" rx="5" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.5"/><rect x="686" y="310" width="22" height="14" rx="2" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.2"/><rect x="680" y="313" width="12" height="4" rx="0" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.1"/><rect x="680" y="319" width="12" height="4" rx="0" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.1"/><text x="554" y="322" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">«component»</text><text x="554" y="340" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Candid.Persistence</text><text x="554" y="358.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">SupabaseResumeRepository over</text><text x="554" y="370.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">@supabase/ssr. Every query</text><text x="554" y="383.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">runs under the caller’s own</text><text x="554" y="395.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">session.</text><line x1="630" y1="300" x2="630" y2="262" stroke="#2563eb" stroke-width="1.4"/><circle cx="630" cy="253" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><text x="630" y="282" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#1e3a8a" text-anchor="middle" font-weight="bold" font-style="normal">ResumeRepository</text><rect x="780" y="300" width="180" height="140" rx="5" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.5"/><rect x="926" y="310" width="22" height="14" rx="2" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.2"/><rect x="920" y="313" width="12" height="4" rx="0" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.1"/><rect x="920" y="319" width="12" height="4" rx="0" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.1"/><text x="794" y="322" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">«component»</text><text x="794" y="340" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Candid.Limiting</text><text x="794" y="358.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">PostgresRateLimiter over a</text><text x="794" y="370.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">SECURITY DEFINER function.</text><text x="794" y="383.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">Fails closed.</text><line x1="870" y1="300" x2="870" y2="262" stroke="#2563eb" stroke-width="1.4"/><circle cx="870" cy="253" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><text x="870" y="282" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#1e3a8a" text-anchor="middle" font-weight="bold" font-style="normal">RateLimiter</text><path d="M497 228 a 13,13 0 0 0 26,0" fill="none" stroke="#5b21b6" stroke-width="2.0"/><line x1="510" y1="228" x2="510" y2="241" stroke="#5b21b6" stroke-width="1.6"/><text x="510" y="256" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#5b21b6" text-anchor="middle" font-weight="normal" font-style="italic">requires all four (ports.ts)</text><rect x="60" y="490" width="420" height="92" rx="5" fill="#f1f5f9" fill-opacity="1.0" stroke="#0f172a" stroke-width="1.5"/><rect x="446" y="500" width="22" height="14" rx="2" fill="#f1f5f9" fill-opacity="1.0" stroke="#0f172a" stroke-width="1.2"/><rect x="440" y="503" width="12" height="4" rx="0" fill="#f1f5f9" fill-opacity="1.0" stroke="#0f172a" stroke-width="1.1"/><rect x="440" y="509" width="12" height="4" rx="0" fill="#f1f5f9" fill-opacity="1.0" stroke="#0f172a" stroke-width="1.1"/><text x="74" y="512" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">«component»</text><text x="74" y="530" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Candid.Web</text><text x="74" y="548.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">Next.js App Router. 10 routes, 8 Server Actions, 2 Route Handlers, nonce-based CSP</text><text x="74" y="560.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">applied in middleware.</text><rect x="540" y="490" width="420" height="92" rx="5" fill="#dcfce7" fill-opacity="1.0" stroke="#15803d" stroke-width="1.5"/><rect x="926" y="500" width="22" height="14" rx="2" fill="#dcfce7" fill-opacity="1.0" stroke="#15803d" stroke-width="1.2"/><rect x="920" y="503" width="12" height="4" rx="0" fill="#dcfce7" fill-opacity="1.0" stroke="#15803d" stroke-width="1.1"/><rect x="920" y="509" width="12" height="4" rx="0" fill="#dcfce7" fill-opacity="1.0" stroke="#15803d" stroke-width="1.1"/><text x="554" y="512" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">«component»</text><text x="554" y="530" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Candid.Export</text><text x="554" y="548.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">pdf-lib and docx renderers driven by the neutral document model. No table, image or</text><text x="554" y="560.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">column can be produced.</text><path d="M60 536 L 26 536 L 26 162 L 300 162" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/><path d="M960 536 L 994 536 L 994 162 L 720 162" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/><text x="34" y="152" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="italic">«use»</text><text x="944" y="152" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="italic">«use»</text><path d="M60 606 h887 l13 13 v31.0 h-900 z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><path d="M947 606 v13 h13 z" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="1.2"/><text x="70" y="622.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">Replacing Claude with another provider means writing one class that satisfies AIProvider. No file under lib/domain changes, and the anti-fabrication tests keep passing unmodified</text><text x="70" y="636.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">— which is the practical test of whether the layering is real or decorative.</text></svg>
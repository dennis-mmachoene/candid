<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 470" width="1020" height="470"><title>Tailoring state machine</title><defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#475569"/></marker>
  <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#2563eb"/></marker>
  <marker id="arrowv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#7c3aed"/></marker>
  <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#b91c1c"/></marker>
  <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9" fill="none" stroke="#475569" stroke-width="1.4"/></marker>
  <marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#475569" stroke-width="1.3"/></marker>
  <marker id="hollowv" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/></marker>
  <marker id="diamond" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
    <path d="M0,5 L6.5,1 L13,5 L6.5,9 z" fill="#ffffff" stroke="#475569" stroke-width="1.2"/></marker>
  <marker id="filldiamond" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
    <path d="M0,5 L6.5,1 L13,5 L6.5,9 z" fill="#475569"/></marker>
</defs><rect width="1020" height="470" fill="#ffffff"/><text x="510" y="32" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">State machine — the lifecycle of a tailoring</text><text x="510" y="52" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">States are the four values of the tailoring_status enum in migration 0001. There is no state in which a blocked claim becomes exportable.</text><circle cx="70" cy="190" r="10" fill="#0f172a" stroke="#0f172a" stroke-width="1.2"/><rect x="130" y="152" width="190" height="74" rx="14" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/><text x="225.0" y="179.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">review</text><text x="225.0" y="199.125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">validated, waiting on the</text><text x="225.0" y="212.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">user to judge borderline claims</text><rect x="400" y="152" width="190" height="74" rx="14" fill="#ede9fe" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.4"/><text x="495.0" y="179.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">approved</text><text x="495.0" y="199.125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">the user has made their</text><text x="495.0" y="212.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">approval decisions</text><rect x="670" y="152" width="190" height="74" rx="14" fill="#dcfce7" fill-opacity="1.0" stroke="#15803d" stroke-width="1.4"/><text x="765.0" y="179.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">exported</text><text x="765.0" y="199.125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">at least one file has</text><text x="765.0" y="212.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">been generated</text><rect x="400" y="306" width="190" height="74" rx="14" fill="#fee2e2" fill-opacity="1.0" stroke="#b91c1c" stroke-width="1.4"/><text x="495.0" y="333.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">blocked</text><text x="495.0" y="353.125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">nothing survived validation —</text><text x="495.0" y="366.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">there is no honest version</text><line x1="80" y1="190" x2="130" y2="190" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><text x="88" y="182" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">tailorResume()</text><line x1="320" y1="178" x2="400" y2="178" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><text x="324" y="170" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">approveClaims()</text><line x1="590" y1="178" x2="670" y2="178" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><text x="600" y="170" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">GET /api/export</text><path d="M860 205 q 40 60 -20 92 L 596 340" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><text x="700" y="300" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">re-export (same document, rebuilt server-side)</text><path d="M225 226 L 225 340 L 400 340" fill="none" stroke="#b91c1c" stroke-width="1.3" marker-end="url(#arrowr)"/><text x="232" y="356" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#b91c1c" text-anchor="start" font-weight="normal" font-style="normal">every claim blocked</text><circle cx="945" cy="190" r="12" fill="none" stroke="#0f172a" stroke-width="1.4"/><circle cx="945" cy="190" r="7" fill="#0f172a" stroke="#0f172a" stroke-width="1.2"/><line x1="866" y1="190" x2="931" y2="190" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M495 380 L 495 420 L 940 420 L 940 206" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="640" y="436" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">deleteAccount() or the 12-month retention purge terminates from any state</text></svg>
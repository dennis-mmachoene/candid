</defs><rect width="1020" height="860" fill="#ffffff"/><text x="510.0" y="34" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Layered architecture — ports and adapters</text><text x="510.0" y="55" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">The dependency rule points inward. Arrows may cross a boundary downward and inward, never outward.</text><rect x="30" y="76" width="960" height="122" rx="10" fill="#eff6ff" fill-opacity="0.55" stroke="#1e3a8a" stroke-width="1.4" stroke-dasharray="6 4"/><text x="42" y="95" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#1e3a8a" text-anchor="start" font-weight="bold" font-style="normal">PRESENTATION LAYER   app/   Next.js 15 App Router, React 19 Server Components</text><rect x="48" y="108" width="290" height="76" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#1e3a8a" stroke-width="1.4"/><text x="193.0" y="130.125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Server Components</text><text x="193.0" y="149.375" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">10 routes — /, /consent, /dashboard, /tailor/[id],</text><text x="193.0" y="162.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">/review/[id], /history, /settings, /privacy, /terms,</text><text x="193.0" y="176.375" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">/goodbye</text><rect x="360" y="108" width="300" height="76" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#1e3a8a" stroke-width="1.4"/><text x="510.0" y="130.125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Server Actions</text><text x="510.0" y="149.375" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">8 actions — uploadCv, tailorResume, approveClaims,</text><text x="510.0" y="162.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">acceptConsent, saveDefaultTemplate, deleteAccount,</text><text x="510.0" y="176.375" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">signIn, signOut</text><rect x="682" y="108" width="290" height="76" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#1e3a8a" stroke-width="1.4"/><text x="827.0" y="143.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Route Handlers</text><text x="827.0" y="162.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">GET /api/export/[id] · GET /auth/callback</text><rect x="30" y="214" width="960" height="96" rx="10" fill="#fffbeb" fill-opacity="0.55" stroke="#b45309" stroke-width="1.4" stroke-dasharray="6 4"/><text x="42" y="233" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="bold" font-style="normal">ACCESS CONTROL   lib/dal.ts   every authoritative identity check, placed next to the data</text><rect x="48" y="244" width="290" height="52" rx="6" fill="#fef3c7" fill-opacity="1.0" stroke="#b45309" stroke-width="1.4"/><text x="193.0" y="267.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">requireUser()</text><text x="193.0" y="286.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">redirects when no verified session</text><rect x="360" y="244" width="300" height="52" rx="6" fill="#fef3c7" fill-opacity="1.0" stroke="#b45309" stroke-width="1.4"/><text x="510.0" y="267.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">requireConsentedUser()</text><text x="510.0" y="286.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">the POPIA §18 gate</text><rect x="682" y="244" width="290" height="52" rx="6" fill="#fef3c7" fill-opacity="1.0" stroke="#b45309" stroke-width="1.4"/><text x="827.0" y="267.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">reverifyForDestructiveAction()</text><text x="827.0" y="286.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">getUser() — hits the auth server, not a cookie</text><rect x="30" y="326" width="960" height="264" rx="10" fill="#f5f3ff" fill-opacity="0.55" stroke="#5b21b6" stroke-width="1.4" stroke-dasharray="6 4"/><text x="42" y="345" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#5b21b6" text-anchor="start" font-weight="bold" font-style="normal">DOMAIN LAYER   lib/domain/   PURE — no vendor SDK, no framework, no I/O. Enforced by ESLint, not by convention.</text><rect x="48" y="360" width="924" height="54" rx="6" fill="#ede9fe" fill-opacity="1.0" stroke="#5b21b6" stroke-width="1.4"/><text x="510.0" y="384.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">tailoring.ts — the use case</text><text x="510.0" y="403.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">The only route to the AI provider, and it de-identifies before it calls. Ordering is a property of the call graph, not a rule to remember.</text><rect x="48" y="428" width="220" height="74" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.4"/><text x="158.0" y="455.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">identity.ts</text><text x="158.0" y="475.125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">GUARANTEE 1</text><text x="158.0" y="488.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">strip identity, redact SA ID</text><rect x="282" y="428" width="220" height="74" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.4"/><text x="392.0" y="455.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">validator.ts</text><text x="392.0" y="475.125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">GUARANTEE 2</text><text x="392.0" y="488.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">ordered specification chain</text><rect x="516" y="428" width="220" height="74" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.4"/><text x="626.0" y="455.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">resume-document.ts</text><text x="626.0" y="475.125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">the single export gate</text><text x="626.0" y="488.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">ATS rules made structural</text><rect x="750" y="428" width="222" height="74" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.4"/><text x="861.0" y="461.25" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">inventory.ts · provenance.ts</text><text x="861.0" y="477.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">learning.ts · consent.ts</text><rect x="48" y="516" width="924" height="56" rx="6" fill="#ddd6fe" fill-opacity="1.0" stroke="#5b21b6" stroke-width="1.4"/><text x="510.0" y="541.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">ports.ts — the interfaces the domain owns</text><text x="510.0" y="560.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">AIProvider · CvParser · ResumeRepository · RateLimiter</text><rect x="30" y="606" width="960" height="118" rx="10" fill="#eff6ff" fill-opacity="0.55" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="6 4"/><text x="42" y="625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="bold" font-style="normal">INFRASTRUCTURE LAYER   lib/infrastructure/   the only place a vendor SDK is imported</text><rect x="48" y="638" width="222" height="70" rx="6" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/><text x="159.0" y="663.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">ClaudeProvider</text><text x="159.0" y="683.125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">implements AIProvider</text><text x="159.0" y="696.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">@anthropic-ai/sdk</text><rect x="282" y="638" width="222" height="70" rx="6" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/><text x="393.0" y="663.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">PdfDocxParser</text><text x="393.0" y="683.125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">implements CvParser</text><text x="393.0" y="696.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">unpdf · mammoth</text><rect x="516" y="638" width="222" height="70" rx="6" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/><text x="627.0" y="663.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">SupabaseResumeRepository</text><text x="627.0" y="683.125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">implements ResumeRepository</text><text x="627.0" y="696.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">@supabase/ssr</text><rect x="750" y="638" width="222" height="70" rx="6" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/><text x="861.0" y="663.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">PostgresRateLimiter</text><text x="861.0" y="683.125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">implements RateLimiter</text><text x="861.0" y="696.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">SECURITY DEFINER RPC</text><line x1="193" y1="184" x2="193" y2="244" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><line x1="510" y1="184" x2="510" y2="244" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><line x1="827" y1="184" x2="827" y2="244" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><line x1="510" y1="296" x2="510" y2="360" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M158 638 L158 572" fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#hollowv)"/><path d="M392 638 L392 572" fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#hollowv)"/><path d="M626 638 L626 572" fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#hollowv)"/><path d="M861 638 L861 572" fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#hollowv)"/><text x="660" y="604" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#7c3aed" text-anchor="start" font-weight="normal" font-style="italic">realises the port</text><path d="M48 742 h447 l13 13 v31.0 h-460 z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><path d="M495 742 v13 h13 z" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="1.2"/><text x="58" y="758.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">ESLint fails the build if lib/domain imports next, react, @supabase/*, @anthropic-ai/*,</text><text x="58" y="772.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">zod, or any I/O or parsing library. Reviewers forget; lint does not.</text><path d="M528 742 h431 l13 13 v31.0 h-444 z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><path d="M959 742 v13 h13 z" fill="#2563eb" fill-opacity="0.25" stroke="#2563eb" stroke-width="1.2"/><text x="538" y="758.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">Dependency inversion is what makes the two guarantees testable with plain fakes,</text><text x="538" y="772.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">and what makes the AI provider replaceable without touching a single business rule.</text></svg>
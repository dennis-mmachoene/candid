<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 700" width="1020" height="700"><title>DevOps pipeline</title><defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#475569"/></marker>
  <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#2563eb"/></marker>
  <marker id="arrowv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#7c3aed"/></marker>
  <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#b91c1c"/></marker>
  <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9" fill="none" stroke="#475569" stroke-width="1.4"/></marker>
  <marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#475569" stroke-width="1.3"/></marker>
  <marker id="hollowv" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/></marker>
  <marker id="diamond" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
    <path d="M0,5 L6.5,1 L13,5 L6.5,9 z" fill="#ffffff" stroke="#475569" stroke-width="1.2"/></marker>
  <marker id="filldiamond" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
    <path d="M0,5 L6.5,1 L13,5 L6.5,9 z" fill="#475569"/></marker>
</defs><rect width="1020" height="700" fill="#ffffff"/><text x="510" y="30" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">DevOps — the path from a keystroke to production</text><text x="510" y="50" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">Four independent gates. Each can stop a change, and each was verified by being made to fail.</text><rect x="40" y="96" width="170" height="56" rx="6" fill="#f1f5f9" fill-opacity="1.0" stroke="#0f172a" stroke-width="1.4"/><text x="125.0" y="121.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Developer</text><text x="125.0" y="140.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">local working copy</text><path d="M210 124 L 250 124" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="250" y="90" width="220" height="130" rx="10" fill="#fef3c7" fill-opacity="1.0" stroke="#b45309" stroke-width="1.5"/><circle cx="272" cy="112" r="13" fill="#b45309" stroke="#b45309" stroke-width="1.2"/><text x="272" y="116" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">1</text><text x="294" y="117" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Pre-push hook</text><text x="268" y="140.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">.githooks/pre-push runs typecheck, lint</text><text x="268" y="152.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">and 125 unit tests before the push</text><text x="268" y="165.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">leaves the machine. Three seconds.</text><text x="268" y="177.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">Skippable with --no-verify, so it stops</text><text x="268" y="190.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">accidents rather than decisions.</text><path d="M470 155 L 510 155" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="510" y="90" width="220" height="130" rx="10" fill="#fee2e2" fill-opacity="1.0" stroke="#b91c1c" stroke-width="1.5"/><circle cx="532" cy="112" r="13" fill="#b91c1c" stroke="#b91c1c" stroke-width="1.2"/><text x="532" y="116" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">2</text><text x="554" y="117" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Branch ruleset</text><text x="528" y="140.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">GitHub refuses a direct push to main. A</text><text x="528" y="152.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">pull request is compulsory. Enforced</text><text x="528" y="165.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">server-side, so --no-verify does not</text><text x="528" y="177.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">help.</text><path d="M730 155 L 770 155" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="770" y="90" width="220" height="130" rx="10" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.5"/><circle cx="792" cy="112" r="13" fill="#2563eb" stroke="#2563eb" stroke-width="1.2"/><text x="792" y="116" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">3</text><text x="814" y="117" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">CI — verify job</text><text x="788" y="140.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">Clean ubuntu-latest runner, Node 22,</text><text x="788" y="152.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">npm ci from the lockfile. typecheck,</text><text x="788" y="165.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">lint, 125 tests, next build. A required</text><text x="788" y="177.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">status check.</text><path d="M880 220 L 880 250 L 620 250 L 620 286" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="400" y="286" width="440" height="116" rx="10" fill="#ede9fe" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.5"/><circle cx="422" cy="308" r="13" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.2"/><text x="422" y="312" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">4</text><text x="444" y="313" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">CI — end-to-end job</text><text x="418" y="336.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">Only on main, only with secrets configured. Playwright starts the app and drives a real</text><text x="418" y="348.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">browser: 55 tests against real Supabase, including two accounts proven unable to read</text><text x="418" y="361.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">each other’s rows.</text><path d="M400 344 L 340 344" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="120" y="316" width="210" height="56" rx="6" fill="#dcfce7" fill-opacity="1.0" stroke="#15803d" stroke-width="1.4"/><text x="225.0" y="341.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Merge to main</text><text x="225.0" y="360.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">squash, branch deleted</text><path d="M225 372 L 225 420" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="120" y="420" width="210" height="56" rx="6" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/><text x="225.0" y="445.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Vercel build</text><text x="225.0" y="464.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">NEXT_PUBLIC_* inlined here</text><path d="M330 448 L 400 448" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="400" y="420" width="210" height="56" rx="6" fill="#dcfce7" fill-opacity="1.0" stroke="#15803d" stroke-width="1.4"/><text x="505.0" y="445.625" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Production</text><text x="505.0" y="464.875" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">HTTPS, HSTS, nonce CSP</text><path d="M650 420 h327 l13 13 v56.19999999999999 h-340 z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><path d="M977 420 v13 h13 z" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="1.2"/><text x="660" y="436.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">The tests were themselves tested. A blocked claim was let through</text><text x="660" y="449.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">the assembler, the residual identity scrub was removed, and the</text><text x="660" y="462.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">validator’s fallthrough was flipped from blocked to accepted. Each</text><text x="660" y="475.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">turned the suite red; each was reverted.</text><rect x="40" y="520" width="950" height="152" rx="8" fill="#f1f5f9" fill-opacity="1.0" stroke="#94a3b8" stroke-width="1.2"/><text x="56" y="544" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">What each gate has actually caught</text><text x="64" y="570" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Unit tests</text><text x="180" y="570" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">A hand-computed Luhn check digit was wrong, so a test ID number was silently not being redacted.</text><text x="64" y="595" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">End-to-end</text><text x="180" y="595" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">CardTitle rendered a &lt;div&gt;. The integrity report had three divs where its three headings should be.</text><text x="64" y="620" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">CI</text><text x="180" y="620" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">With no Supabase secrets the URL was empty, the client threw in middleware, and every page returned 500 — including the landing page.</text><text x="64" y="645" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="bold" font-style="normal">Ruleset</text><text x="180" y="645" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="normal" font-style="normal">Refused a direct push of four commits to main, which is what sent them through a pull request instead.</text></svg>
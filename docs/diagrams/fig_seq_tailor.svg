  <marker id="hollowv" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/></marker>
  <marker id="diamond" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
    <path d="M0,5 L6.5,1 L13,5 L6.5,9 z" fill="#ffffff" stroke="#475569" stroke-width="1.2"/></marker>
  <marker id="filldiamond" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
    <path d="M0,5 L6.5,1 L13,5 L6.5,9 z" fill="#475569"/></marker>
</defs><rect width="1020" height="830" fill="#ffffff"/><text x="510" y="28" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Sequence diagram — tailoring a CV against a job advert</text><text x="510" y="48" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">The de-identification step happens before the provider is reachable. That ordering is enforced by the call graph, not by discipline.</text><rect x="15.0" y="86" width="126" height="48" rx="6" fill="#f1f5f9" fill-opacity="1.0" stroke="#0f172a" stroke-width="1.4"/><text x="78.0" y="108.1125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Job Seeker</text><text x="78.0" y="125.4125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">actor</text><line x1="78" y1="134" x2="78" y2="790" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="5 5"/><rect x="148.0" y="86" width="132" height="48" rx="6" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/><text x="214.0" y="108.1125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">tailorResume()</text><text x="214.0" y="125.4125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">Server Action</text><line x1="214" y1="134" x2="214" y2="790" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="5 5"/><rect x="284.0" y="86" width="132" height="48" rx="6" fill="#fef3c7" fill-opacity="1.0" stroke="#b45309" stroke-width="1.4"/><text x="350.0" y="108.1125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">DAL + limiter</text><text x="350.0" y="125.4125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">lib/dal.ts</text><line x1="350" y1="134" x2="350" y2="790" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="5 5"/><rect x="424.0" y="86" width="140" height="48" rx="6" fill="#ede9fe" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.4"/><text x="494.0" y="108.1125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">tailorCv()</text><text x="494.0" y="125.4125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">domain use case</text><line x1="494" y1="134" x2="494" y2="790" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="5 5"/><rect x="572.0" y="86" width="148" height="48" rx="6" fill="#ede9fe" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.4"/><text x="646.0" y="108.1125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">identity + validator</text><text x="646.0" y="125.4125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">domain</text><line x1="646" y1="134" x2="646" y2="790" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="5 5"/><rect x="729.0" y="86" width="142" height="48" rx="6" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/><text x="800.0" y="108.1125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">ClaudeProvider</text><text x="800.0" y="125.4125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">adapter → Anthropic</text><line x1="800" y1="134" x2="800" y2="790" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="5 5"/><rect x="878.0" y="86" width="136" height="48" rx="6" fill="#dcfce7" fill-opacity="1.0" stroke="#15803d" stroke-width="1.4"/><text x="946.0" y="108.1125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="bold" font-style="normal">Supabase</text><text x="946.0" y="125.4125" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="normal" font-style="normal">PostgreSQL + RLS</text><line x1="946" y1="134" x2="946" y2="790" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="5 5"/><line x1="84" y1="160" x2="208" y2="160" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><text x="146.0" y="154" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">submit advert + CV id</text><rect x="208" y="154" width="12" height="560" rx="0" fill="#ffffff" fill-opacity="1.0" stroke="#475569" stroke-width="1.1"/><line x1="220" y1="194" x2="344" y2="194" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><text x="282.0" y="188" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">requireConsentedUser()</text><rect x="344" y="188" width="12" height="92" rx="0" fill="#ffffff" fill-opacity="1.0" stroke="#475569" stroke-width="1.1"/><path d="M356 220 h26 v22 h-26" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><text x="388" y="226" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">getClaims()</text><text x="388" y="239" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#475569" text-anchor="start" font-weight="normal" font-style="italic">verifies the JWT signature</text><line x1="344" y1="262" x2="220" y2="262" stroke="#475569" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/><text x="282.0" y="256" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">VerifiedUser</text><line x1="220" y1="292" x2="344" y2="292" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><text x="282.0" y="286" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">consume("tailor")  10 / hour</text><rect x="344" y="286" width="12" height="44" rx="0" fill="#ffffff" fill-opacity="1.0" stroke="#475569" stroke-width="1.1"/><line x1="344" y1="318" x2="220" y2="318" stroke="#475569" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/><text x="282.0" y="312" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">true | false — fails closed</text><rect x="190" y="334" width="790" height="296" rx="3" fill="none" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5 4"/><path d="M190 334 h56 l10 16 h-66 z" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1.2"/><text x="198" y="346" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#7c3aed" text-anchor="start" font-weight="bold" font-style="normal">ref</text><text x="264" y="346" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#7c3aed" text-anchor="start" font-weight="normal" font-style="italic">the guarantee sequence — domain only, no vendor code reachable</text><line x1="220" y1="368" x2="488" y2="368" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><text x="354.0" y="362" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">tailorCv(rawText, advert, provider)</text><rect x="488" y="362" width="12" height="200" rx="0" fill="#ede9fe" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.1"/><line x1="500" y1="398" x2="640" y2="398" stroke="#b91c1c" stroke-width="1.3" marker-end="url(#arrow)"/><text x="570.0" y="392" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">deidentify(rawCvText)</text><rect x="640" y="392" width="12" height="46" rx="0" fill="#fee2e2" fill-opacity="1.0" stroke="#b91c1c" stroke-width="1.1"/><line x1="640" y1="426" x2="500" y2="426" stroke="#b91c1c" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/><text x="570.0" y="420" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">identity withheld · ID numbers redacted</text><line x1="500" y1="452" x2="640" y2="452" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><text x="570.0" y="446" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">buildInventory(deidentified content)</text><rect x="640" y="446" width="12" height="40" rx="0" fill="#ffffff" fill-opacity="1.0" stroke="#475569" stroke-width="1.1"/><line x1="640" y1="478" x2="500" y2="478" stroke="#475569" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/><text x="570.0" y="472" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">SkillInventory</text><line x1="500" y1="508" x2="794" y2="508" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow)"/><text x="647.0" y="502" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">tailor({ deidentifiedCv, jobAdvert })</text><rect x="794" y="502" width="12" height="60" rx="0" fill="#dbeafe" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.1"/><text x="723" y="520" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="8.5" fill="#2563eb" text-anchor="middle" font-weight="normal" font-style="italic">advert delimited, sent as data</text><line x1="794" y1="552" x2="500" y2="552" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/><text x="647.0" y="546" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">TailoredDraft — Zod-validated at the boundary</text><line x1="500" y1="578" x2="640" y2="578" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arrow)"/><text x="570.0" y="572" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">reviewDraft(draft, inventory)</text><rect x="640" y="572" width="12" height="40" rx="0" fill="#ede9fe" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.1"/><line x1="640" y1="604" x2="500" y2="604" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/><text x="570.0" y="598" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">IntegrityReport</text><line x1="220" y1="644" x2="940" y2="644" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/><text x="580.0" y="638" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">saveTailoring(draft, report)   status = review</text><rect x="940" y="638" width="12" height="46" rx="0" fill="#dcfce7" fill-opacity="1.0" stroke="#15803d" stroke-width="1.1"/><line x1="940" y1="672" x2="220" y2="672" stroke="#475569" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/><text x="580.0" y="666" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">row written under the caller’s own RLS policy</text><line x1="208" y1="702" x2="84" y2="702" stroke="#475569" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/><text x="146.0" y="696" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="normal" font-style="normal">redirect → /review/[id]</text><path d="M30 754 h457 l13 13 v29.599999999999994 h-470 z" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><path d="M487 754 v13 h13 z" fill="#b91c1c" fill-opacity="0.25" stroke="#b91c1c" stroke-width="1.2"/><text x="40" y="770.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">The provider never receives a name, an email, a phone number or an ID number. The port has no</text><text x="40" y="783.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">field for any of them, so a leak is a type error rather than an oversight.</text><path d="M520 754 h457 l13 13 v29.599999999999994 h-470 z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><path d="M977 754 v13 h13 z" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="1.2"/><text x="530" y="770.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">A hostile advert reaches the model as delimited data. Even a fully successful injection cannot</text><text x="530" y="783.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="normal" font-style="normal">fabricate: the reply is judged against the inventory afterwards.</text></svg>
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first. No point burning minutes
# on a commit nobody is waiting for any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Build-time placeholders only.
      #
      # `next build` evaluates the environment schema, so these have to be
      # present and well-formed. They are deliberately fake: CI does not touch
      # a real database, and a workflow that needed production credentials to
      # typecheck would be a workflow that leaks them eventually.
      #
      # The encryption key is 32 zero bytes, base64. It encrypts nothing here.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
      ANTHROPIC_API_KEY: ci-placeholder
      ANTHROPIC_MODEL: claude-haiku-4-5-20251001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` not `install`: it installs exactly what the lockfile says and
      # fails if package.json and the lockfile disagree.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The step that matters.
      #
      # These are the guarantee tests: the CV name never reaches the model, a
      # blocked claim never reaches a file, an injected advert cannot fabricate
      # a skill, exports survive a round trip through a real parser. If any of
      # them regress, this job goes red and nothing merges. That is the point
      # of having them.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    # Only on main, and only when the repository has the secrets configured.
    # A fork's pull request has no secrets and must not fail because of it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      # Every variable falls back to a placeholder.
      #
      # Without a fallback an unset secret becomes an empty string, the Supabase
      # client cannot be constructed, and middleware throws on every request --
      # so even the public specs fail, for a reason that has nothing to do with
      # the code. That is exactly what happened on the first CI run.
      #
      # With placeholders the app boots, the public and responsive specs run
      # properly (they need no backend), and the authenticated specs skip and
      # say why. Add the real secrets to include those too.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_placeholder' }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ENCRYPTION_KEY: ${{ secrets.E2E_ENCRYPTION_KEY || 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' }}
      # No fallback for these two. An absent secret leaves them unset, which is
      # what makes the authenticated specs skip loudly rather than fail
      # obscurely against a placeholder that cannot work.
      SUPABASE_SECRET_KEY: ${{ secrets.E2E_SUPABASE_SECRET_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      # Deliberately absent, so the paid tailoring step skips. Add
      # ANTHROPIC_API_KEY as a secret and reference it here to include it.
      ANTHROPIC_MODEL: claude-haiku-4-5-20251001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install browser
        run: npm run e2e:install

      # Skips cleanly rather than failing when the secrets are not configured.
      # A suite that goes red for a missing secret teaches people to ignore red.
      - name: End-to-end tests
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
